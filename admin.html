<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Bielyy Store</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="site-asset-0.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#6D42B8; --purple:#8B5FD1; --purple-soft:#B79BEA; --lavender:#F3ECFF;
    --pink:#FF7FAE; --pink-soft:#FFD9E6; --cream:#FFF9FC; --ink:#3A2E52; --ink-soft:#7A6E96;
    --green:#2E9E4F; --red:#D6532B; --line:#EDE4FA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Poppins',sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; padding:20px 14px 60px; font-size:14px;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select,textarea{font-family:inherit; font-size:14px;}
  h1,h2,h3{font-family:'Baloo 2',cursive; color:var(--purple-deep);}
  .wrap{max-width:1040px; margin:0 auto;}
  .hide{display:none !important;}

  /* login */
  #gate{max-width:360px; margin:80px auto; background:#fff; border-radius:20px; padding:32px 28px; box-shadow:0 12px 32px rgba(109,66,184,.12); text-align:center;}
  #gate img{width:64px; height:64px; border-radius:50%; object-fit:cover; margin-bottom:10px; border:2px solid var(--purple-soft);}
  #gate h2{font-size:22px; margin-bottom:4px;}
  #gate p{color:var(--ink-soft); font-size:13.5px; margin-bottom:18px;}
  #gate input{width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--lavender); margin-bottom:12px;}
  #gate input:focus{outline:none; border-color:var(--purple);}
  #gate .go{width:100%; padding:12px; border-radius:12px; background:linear-gradient(135deg,var(--purple),var(--pink)); color:#fff; font-weight:700;}
  #gateError{color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px;}

  header{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  header h1{font-size:25px;}
  .hdr-r{display:flex; gap:8px; align-items:center;}
  .pill{background:var(--lavender); color:var(--purple-deep); font-size:12px; font-weight:700; padding:6px 13px; border-radius:999px;}
  .ghost{padding:7px 14px; border-radius:999px; border:1.5px solid var(--purple-soft); background:#fff; color:var(--purple-deep); font-size:12.5px; font-weight:700;}
  .ghost:hover{background:var(--lavender);}
  .tabs{display:flex; gap:6px; margin-bottom:16px; overflow-x:auto;}
  .tab{padding:10px 18px; border-radius:999px; background:#fff; border:1.5px solid var(--line); color:var(--ink-soft); font-weight:700; font-size:13.5px; white-space:nowrap;}
  .tab.on{background:var(--purple-deep); border-color:var(--purple-deep); color:#fff;}
  .tab .badge{background:var(--pink); color:#fff; border-radius:999px; padding:1px 7px; font-size:11px; margin-left:6px;}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px;}
  .stat{background:#fff; border-radius:16px; padding:14px 16px; box-shadow:0 4px 14px rgba(109,66,184,.07);}
  .stat .num{font-family:'Baloo 2'; font-size:24px; color:var(--purple-deep); line-height:1.1;}
  .stat .lbl{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.3px; font-weight:600; margin-top:2px;}
  .stat.warn .num{color:#C24E7A;}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
  .toolbar input[type=search]{flex:1 1 220px; padding:10px 14px; border-radius:12px; border:1.5px solid var(--line); background:#fff;}
  .toolbar input:focus,.toolbar select:focus{outline:none; border-color:var(--purple);}
  .toolbar select{padding:10px 12px; border-radius:12px; border:1.5px solid var(--line); background:#fff;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .chip{padding:7px 14px; border-radius:999px; background:#fff; color:var(--ink-soft); font-size:12.5px; font-weight:600; border:1.5px solid var(--line);}
  .chip.on{background:var(--purple-deep); color:#fff; border-color:var(--purple-deep);}

  /* lista de pedidos */
  .o-row{background:#fff; border-radius:16px; padding:14px 16px; margin-bottom:10px; box-shadow:0 4px 14px rgba(109,66,184,.07); cursor:pointer; display:grid; grid-template-columns:1fr auto; gap:6px 12px; border:1.5px solid transparent;}
  .o-row:hover{border-color:var(--purple-soft);}
  .o-name{font-weight:700; font-size:15px;}
  .o-sub{font-size:12px; color:var(--ink-soft);}
  .o-items{grid-column:1 / -1; font-size:12.5px; color:#5b5073; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .o-right{text-align:right;}
  .o-total{font-family:'Baloo 2'; font-weight:700; font-size:18px; color:var(--purple-deep);}
  .tags{grid-column:1 / -1; display:flex; gap:6px; flex-wrap:wrap;}
  .tag{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--lavender); color:var(--purple-deep);}
  .tag.cup{background:#FFF1C9; color:#8A6400;}
  .tag.pre{background:#E9E1FB;}
  .status{font-size:11px; font-weight:700; padding:4px 11px; border-radius:999px; white-space:nowrap; display:inline-block;}
  .st-aguardando_pagamento{background:var(--pink-soft); color:#C24E7A;}
  .st-pago{background:#E1F5E8; color:var(--green);}
  .st-em_preparacao{background:#FFF3D6; color:#A87800;}
  .st-enviado{background:#DCEBFF; color:#3468C0;}
  .st-entregue{background:var(--lavender); color:var(--purple-deep);}
  .st-cancelado{background:#EEE; color:#777;}
  .empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}

  /* detalhe do pedido */
  #ov{position:fixed; inset:0; background:rgba(40,25,70,.45); z-index:50; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:20px 12px;}
  #ov.show{display:flex;}
  #detail{background:var(--cream); border-radius:22px; width:100%; max-width:720px; padding:20px 18px 24px; box-shadow:0 24px 60px rgba(40,25,70,.3);}
  .d-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px;}
  .d-top h2{font-size:22px; line-height:1.2;}
  .x{width:36px; height:36px; border-radius:50%; background:#fff; border:1.5px solid var(--line); font-size:16px; flex-shrink:0;}
  .card{background:#fff; border-radius:16px; padding:14px 16px; margin-bottom:12px; box-shadow:0 3px 12px rgba(109,66,184,.06);}
  .card h3{font-size:15px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .kv{display:grid; grid-template-columns:120px 1fr; gap:4px 10px; font-size:13.5px;}
  .kv dt{color:var(--ink-soft);}
  .kv dd{word-break:break-word;}
  .steps{display:flex; gap:4px; margin:6px 0 4px; overflow-x:auto;}
  .step{flex:1; min-width:78px; text-align:center; font-size:10.5px; font-weight:700; color:#b3a9c9; padding-top:18px; position:relative;}
  .step::before{content:''; position:absolute; top:0; left:50%; margin-left:-7px; width:14px; height:14px; border-radius:50%; background:#E7DEF6;}
  .step.done{color:var(--purple-deep);} .step.done::before{background:var(--purple-deep);}
  .step.now::before{background:var(--pink); box-shadow:0 0 0 4px var(--pink-soft);}
  table.it{width:100%; border-collapse:collapse; font-size:13px;}
  table.it th{text-align:left; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.3px; padding:4px 6px 6px 0; border-bottom:1px solid var(--line);}
  table.it td{padding:8px 6px 8px 0; border-bottom:1px solid #F6F0FD; vertical-align:top;}
  table.it td.r,table.it th.r{text-align:right; white-space:nowrap;}
  .sum{margin-top:10px; font-size:13.5px;}
  .sum div{display:flex; justify-content:space-between; padding:3px 0;}
  .sum .tot{font-family:'Baloo 2'; font-weight:700; font-size:19px; color:var(--purple-deep); border-top:1px solid var(--line); margin-top:6px; padding-top:8px;}
  .sum .disc{color:var(--green);}
  .btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .btn{padding:9px 16px; border-radius:999px; font-weight:700; font-size:13px; background:var(--purple-deep); color:#fff;}
  .btn.wa{background:#25A244;} .btn.red{background:#fff; color:var(--red); border:1.5px solid #F0C4B6;}
  .btn.line{background:#fff; color:var(--purple-deep); border:1.5px solid var(--purple-soft);}
  .field{width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); margin-top:6px;}
  textarea.field{min-height:70px; resize:vertical;}
  .addr{background:var(--lavender); border-radius:12px; padding:12px 14px; font-size:14px; line-height:1.6; margin-top:6px;}
  .cm{background:#FFF7DA; border-radius:12px; padding:10px 14px; font-size:13px; color:#7A5A00; margin-top:8px;}

  /* clientes */
  .c-row{background:#fff; border-radius:16px; padding:14px 16px; margin-bottom:10px; box-shadow:0 4px 14px rgba(109,66,184,.07);}
  .c-top{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .c-name{font-weight:700; font-size:15px;}
  .c-meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.6;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px; font-size:13px; z-index:99; opacity:0; pointer-events:none; transition:.25s;}
  .toast.show{opacity:1;}
  @media (max-width:560px){ .kv{grid-template-columns:96px 1fr;} .o-total{font-size:16px;} }
</style>
</head>
<body>
<div class="wrap">

  <div id="gate">
    <img src="site-asset-0.jpg" alt="">
    <h2>Painel da loja</h2>
    <p>Área da administradora da Bielyy Store. Digite a senha.</p>
    <input type="password" id="pwdInput" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter') login()">
    <button class="go" onclick="login()">Entrar</button>
    <div id="gateError"></div>
  </div>

  <div id="app" class="hide">
    <header>
      <h1>🐾 Painel Bielyy</h1>
      <div class="hdr-r">
        <span class="pill" id="syncPill">—</span>
        <button class="ghost" onclick="refresh(true)">↻ Atualizar</button>
        <button class="ghost" onclick="logout()">Sair</button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab on" data-tab="orders" onclick="setTab('orders')">📦 Pedidos <span class="badge hide" id="newBadge"></span></button>
      <button class="tab" data-tab="customers" onclick="setTab('customers')">👥 Clientes</button>
      <button class="tab" data-tab="reviews" onclick="setTab('reviews')">⭐ Avaliações</button>
    </div>

    <!-- PEDIDOS -->
    <section id="tab-orders">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <input type="search" id="q" placeholder="Buscar por nome, telefone, nº do pedido, cupom ou produto" oninput="renderOrders()">
        <select id="payF" onchange="renderOrders()">
          <option value="all">Todos os pagamentos</option>
          <option value="whatsapp">WhatsApp</option>
          <option value="infinitepay">InfinitePay</option>
        </select>
        <select id="couponF" onchange="renderOrders()"><option value="all">Todos os cupons</option></select>
        <button class="ghost" onclick="exportOrdersCSV()">⬇ Exportar CSV</button>
      </div>
      <div class="chips" id="statusChips"></div>
      <div id="ordersList"></div>
    </section>

    <!-- CLIENTES -->
    <section id="tab-customers" class="hide">
      <div class="toolbar">
        <input type="search" id="cq" placeholder="Buscar cliente por nome, telefone, e-mail ou cidade" oninput="renderCustomers()">
        <button class="ghost" onclick="exportCustomersCSV()">⬇ Exportar CSV</button>
      </div>
      <div id="customersList"></div>
    </section>

    <!-- AVALIAÇÕES -->
    <section id="tab-reviews" class="hide"><div id="reviewsList"></div></section>
  </div>
</div>

<!-- detalhe -->
<div id="ov" onclick="if(event.target===this) closeDetail()"><div id="detail"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ estado ============ */
let PASSWORD = '';
let RAW = [];        // pedidos como vêm do servidor
let ORDERS = [];     // normalizados
let USERS = [];      // contas cadastradas
let STATUS_F = 'all';
let SEEN = new Set(JSON.parse(localStorage.getItem('bielyy_seen_orders') || '[]'));
let firstLoad = true;
let pollTimer = null;

// Cupons com comissão (para calcular quanto pagar ao adestrador)
const COUPON_INFO = {
  'MATEUSADESTRA': { who: 'Mateus (adestrador)', pct: 0.05 }
};
const STATUS_LABEL = {
  aguardando_pagamento: '⏳ Aguardando pagamento', pago: '✅ Pago', em_preparacao: '📦 Em preparação',
  enviado: '🚚 Enviado', entregue: '🎉 Entregue', cancelado: '✖ Cancelado'
};
const FLOW = ['aguardando_pagamento','pago','em_preparacao','enviado','entregue'];
const NEXT = { aguardando_pagamento:'pago', pago:'em_preparacao', em_preparacao:'enviado', enviado:'entregue' };
const NEXT_LABEL = { aguardando_pagamento:'✅ Confirmar pagamento', pago:'📦 Iniciar preparação', em_preparacao:'🚚 Marcar como enviado', enviado:'🎉 Marcar como entregue' };
const COUNTS_AS_SALE = ['pago','em_preparacao','enviado','entregue'];

/* ============ utilidades ============ */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Number(n)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const digits = s => String(s||'').replace(/\D/g,'');
const dt = iso => iso ? new Date(iso).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : '—';
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2200); }
function copy(text, okMsg){
  const done = ()=>toast(okMsg || 'Copiado ✓');
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>fallback()); }
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){toast('Não consegui copiar');} ta.remove(); }
}
function waLink(phone, text){
  let d = digits(phone); if(d.length<=11) d = '55'+d;
  return 'https://wa.me/'+d+(text?('?text='+encodeURIComponent(text)):'');
}
function api(path, opts){
  opts = opts || {}; opts.headers = Object.assign({'x-admin-password': PASSWORD}, opts.headers||{});
  return fetch('/.netlify/functions/'+path, opts).then(r=>{ if(r.status===401) throw new Error('senha'); return r.json(); });
}

/* ============ normalização ============ */
function normalize(o){
  const items = Array.isArray(o.itemsDetailed) && o.itemsDetailed.length
    ? o.itemsDetailed.map(i=>({ name:i.name, variant:i.variant||'', qty:i.qty, unit:i.unitPrice, preorder:!!i.preorder }))
    : (o.items||[]).filter(i=>!/^Frete \(/i.test(i.description||'')).map(i=>({ name:i.description, variant:'', qty:i.quantity, unit:(i.price||0)/100, preorder:false }));
  const itemsSum = items.reduce((s,i)=>s+i.qty*i.unit,0);
  const subtotal = o.subtotal != null ? o.subtotal : itemsSum;
  const coupon = o.coupon && o.coupon.code ? o.coupon : null;
  const discount = coupon ? (coupon.discount||0) : 0;
  const shipPrice = o.shipping ? (o.shipping.price||0) : 0;
  const total = o.paid_amount ? o.paid_amount/100 : (o.total != null ? o.total : Math.max(0, subtotal-discount)+shipPrice);
  const addr = o.address || {};
  const pm = o.paymentMethod || 'infinitepay';
  const info = coupon ? COUPON_INFO[coupon.code] : null;
  const commission = info && COUNTS_AS_SALE.includes(o.status) ? info.pct * Math.max(0, subtotal - discount) : 0;
  return Object.assign({}, o, { _items:items, _subtotal:subtotal, _coupon:coupon, _discount:discount, _ship:o.shipping||null, _total:total,
    _addr:addr, _pm:pm, _commission:commission, _info:info,
    _cust:o.customer||{}, _date:o.createdAt, _sale:COUNTS_AS_SALE.includes(o.status) });
}
const fmtCep = c => { const d=digits(c); return d.length===8 ? d.slice(0,5)+'-'+d.slice(5) : (c||''); };
function addrLines(o){
  const a=o._addr;
  const l1 = [a.street, a.number].filter(Boolean).join(', ') + (a.complement ? ' — '+a.complement : '');
  return { l1, l2:a.neighborhood||'', l3:a.city||'', l4:a.cep ? ('CEP '+fmtCep(a.cep)) : '' };
}
function addrText(o){
  const x=addrLines(o);
  return [o._cust.name, x.l1, x.l2, x.l3, x.l4].filter(Boolean).join('\n');
}
function payLabel(o){
  if(o._pm==='whatsapp') return 'WhatsApp (pagamento combinado por lá)';
  const d = o.paymentDetail ? (o.paymentDetail==='pix'?' · Pix':' · Cartão') : '';
  const cm = o.capture_method ? ' · '+esc(o.capture_method) : '';
  return 'InfinitePay'+d+cm;
}
function itemsText(o){ return o._items.map(i=>`${i.qty}x ${i.name}${i.variant?' ('+i.variant+')':''}`).join('; '); }

/* ============ login / carga ============ */
function login(){
  const pwd = document.getElementById('pwdInput').value;
  if(!pwd) return;
  PASSWORD = pwd; refresh(true, true);
}
function logout(){ sessionStorage.removeItem('bielyy_admin_pwd'); location.reload(); }

function refresh(manual, fromLogin){
  return Promise.all([ api('get-orders'), api('get-customers').catch(e=>{ if(e.message==='senha') throw e; return {users:[]}; }) ])
    .then(([o, c])=>{
      RAW = o.orders || []; USERS = c.users || [];
      ORDERS = RAW.map(normalize);
      sessionStorage.setItem('bielyy_admin_pwd', PASSWORD);
      document.getElementById('gate').classList.add('hide');
      document.getElementById('app').classList.remove('hide');
      detectNew();
      renderAll();
      document.getElementById('syncPill').textContent = 'Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      if(!pollTimer) pollTimer = setInterval(()=>refresh(false), 60000);
      if(manual && !fromLogin) toast('Atualizado ✓');
    })
    .catch(err=>{
      if(err.message==='senha'){
        sessionStorage.removeItem('bielyy_admin_pwd');
        if(fromLogin) document.getElementById('gateError').textContent='Senha incorreta.';
        else location.reload();
      } else if(fromLogin){
        document.getElementById('gateError').textContent='Erro ao carregar. Tente de novo.';
      } else if(manual){ toast('Sem conexão. Tente de novo.'); }
    });
}
function detectNew(){
  const ids = ORDERS.map(o=>o.order_nsu);
  if(firstLoad){
    firstLoad=false;
    if(SEEN.size===0) ids.forEach(i=>SEEN.add(i));
  }
  const fresh = ids.filter(i=>!SEEN.has(i));
  const b = document.getElementById('newBadge');
  if(fresh.length){ b.textContent = fresh.length+' novo'+(fresh.length>1?'s':''); b.classList.remove('hide'); document.title='('+fresh.length+') Novo pedido — Bielyy'; if(!detectNew.notified || detectNew.notified!==fresh.length){ toast('🛒 '+fresh.length+' pedido'+(fresh.length>1?'s':'')+' novo'+(fresh.length>1?'s':'')+'!'); detectNew.notified=fresh.length; } }
  else { b.classList.add('hide'); document.title='Painel — Bielyy Store'; }
}
function markSeen(){
  ORDERS.forEach(o=>SEEN.add(o.order_nsu));
  localStorage.setItem('bielyy_seen_orders', JSON.stringify([...SEEN].slice(-500)));
  detectNew.notified=0; detectNew();
}

/* ============ abas ============ */
function setTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  ['orders','customers','reviews'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('hide', x!==t));
  if(t==='orders') markSeen();
  if(t==='customers') renderCustomers();
  if(t==='reviews') loadReviews();
}
function renderAll(){ renderStats(); renderChips(); renderCouponFilter(); renderOrders(); renderCustomers(); }

/* ============ pedidos ============ */
function renderStats(){
  const sales = ORDERS.filter(o=>o._sale);
  const fat = sales.reduce((s,o)=>s+o._total,0);
  const aEnviar = ORDERS.filter(o=>o.status==='pago'||o.status==='em_preparacao').length;
  const aguard = ORDERS.filter(o=>o.status==='aguardando_pagamento').length;
  const com = ORDERS.reduce((s,o)=>s+o._commission,0);
  const hoje = ORDERS.filter(o=>o._date && new Date(o._date).toDateString()===new Date().toDateString()).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${hoje}</div><div class="lbl">Pedidos hoje</div></div>
    <div class="stat ${aEnviar?'warn':''}"><div class="num">${aEnviar}</div><div class="lbl">Para enviar</div></div>
    <div class="stat ${aguard?'warn':''}"><div class="num">${aguard}</div><div class="lbl">Aguardando pagamento</div></div>
    <div class="stat"><div class="num">${fmt(fat)}</div><div class="lbl">Faturamento (pagos)</div></div>
    <div class="stat"><div class="num">${sales.length?fmt(fat/sales.length):'—'}</div><div class="lbl">Ticket médio</div></div>
    <div class="stat"><div class="num">${fmt(com)}</div><div class="lbl">Comissão a pagar (cupons)</div></div>`;
}
function renderChips(){
  const cnt = s => s==='all' ? ORDERS.length : ORDERS.filter(o=>o.status===s).length;
  const list = [['all','Todos'],['aguardando_pagamento','Aguardando'],['pago','Pagos'],['em_preparacao','Em preparação'],['enviado','Enviados'],['entregue','Entregues'],['cancelado','Cancelados']];
  document.getElementById('statusChips').innerHTML = list.map(([k,l])=>`<button class="chip ${STATUS_F===k?'on':''}" onclick="STATUS_F='${k}';renderChips();renderOrders()">${l} (${cnt(k)})</button>`).join('');
}
function renderCouponFilter(){
  const sel = document.getElementById('couponF'); const cur = sel.value;
  const codes = [...new Set(ORDERS.map(o=>o._coupon && o._coupon.code).filter(Boolean))];
  sel.innerHTML = '<option value="all">Todos os cupons</option><option value="none">Sem cupom</option>' + codes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  sel.value = [...sel.options].some(o=>o.value===cur) ? cur : 'all';
}
function filtered(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const qd = digits(q);
  const pay = document.getElementById('payF').value, cf = document.getElementById('couponF').value;
  return ORDERS.filter(o=>{
    if(STATUS_F!=='all' && o.status!==STATUS_F) return false;
    if(pay!=='all' && o._pm!==pay) return false;
    if(cf==='none' && o._coupon) return false;
    if(cf!=='all' && cf!=='none' && (!o._coupon || o._coupon.code!==cf)) return false;
    if(!q) return true;
    const hay = [o.order_nsu, o._cust.name, o._cust.email, o._cust.phone, o._addr.city, o._coupon&&o._coupon.code, itemsText(o)].join(' ').toLowerCase();
    return hay.includes(q) || (qd.length>=4 && digits(o._cust.phone).includes(qd));
  });
}
function renderOrders(){
  const list = filtered(); const box = document.getElementById('ordersList');
  if(!list.length){ box.innerHTML = '<div class="empty">Nenhum pedido por aqui.</div>'; return; }
  box.innerHTML = list.map(o=>{
    const n = o._items.reduce((s,i)=>s+i.qty,0);
    const pre = o._items.some(i=>i.preorder);
    return `<div class="o-row" onclick="openDetail('${esc(o.order_nsu)}')">
      <div><div class="o-name">${esc(o._cust.name||'Cliente')}</div>
        <div class="o-sub">#${esc(o.order_nsu)} · ${dt(o._date)} · ${o._pm==='whatsapp'?'WhatsApp':'InfinitePay'}</div></div>
      <div class="o-right"><div class="o-total">${fmt(o._total)}</div><span class="status st-${esc(o.status)}">${STATUS_LABEL[o.status]||esc(o.status)}</span></div>
      <div class="o-items">${n} ${n===1?'item':'itens'}: ${esc(itemsText(o))}</div>
      <div class="tags">${o._coupon?`<span class="tag cup">🎟 ${esc(o._coupon.code)}</span>`:''}${pre?'<span class="tag pre">📦 Encomenda</span>':''}${o._addr.city?`<span class="tag">📍 ${esc(o._addr.city)}</span>`:''}${o.trackingCode?`<span class="tag">🔎 ${esc(o.trackingCode)}</span>`:''}</div>
    </div>`;
  }).join('');
}

/* ============ detalhe do pedido ============ */
let CUR = null;
function openDetail(id){
  const o = ORDERS.find(x=>x.order_nsu===id); if(!o) return; CUR = id;
  const a = addrLines(o), c = o._cust;
  const idx = FLOW.indexOf(o.status);
  const stepper = o.status==='cancelado' ? '<p style="color:#777;font-size:13px">Pedido cancelado.</p>' :
    `<div class="steps">${FLOW.map((s,i)=>`<div class="step ${i<idx?'done':''} ${i===idx?'now done':''}">${STATUS_LABEL[s].replace(/^\S+ /,'')}</div>`).join('')}</div>`;
  const next = NEXT[o.status];
  const msgStatus = {
    pago:`Oi, ${(c.name||'').split(' ')[0]}! Recebemos o pagamento do seu pedido #${o.order_nsu}. Já vamos separar tudo com carinho 💜`,
    em_preparacao:`Oi, ${(c.name||'').split(' ')[0]}! Seu pedido #${o.order_nsu} está sendo preparado 📦`,
    enviado:`Oi, ${(c.name||'').split(' ')[0]}! Seu pedido #${o.order_nsu} foi enviado 🚚${o.trackingCode?' Código de rastreio: '+o.trackingCode:''}`,
    aguardando_pagamento:`Oi, ${(c.name||'').split(' ')[0]}! Recebemos o seu pedido #${o.order_nsu} (${fmt(o._total)}). Vamos combinar o pagamento? 💜`
  }[o.status] || `Oi, ${(c.name||'').split(' ')[0]}! Sobre o seu pedido #${o.order_nsu} da Bielyy Store.`;
  document.getElementById('detail').innerHTML = `
    <div class="d-top"><div><h2>Pedido #${esc(o.order_nsu)}</h2>
      <div class="o-sub">${dt(o._date)} · <span class="status st-${esc(o.status)}">${STATUS_LABEL[o.status]||esc(o.status)}</span></div></div>
      <button class="x" onclick="closeDetail()">✕</button></div>

    <div class="card"><h3>Andamento</h3>${stepper}
      <div class="btnrow">
        ${next?`<button class="btn" onclick="setStatus('${next}')">${NEXT_LABEL[o.status]}</button>`:''}
        ${o.status!=='cancelado' && o.status!=='entregue'?`<button class="btn red" onclick="if(confirm('Cancelar este pedido?')) setStatus('cancelado')">Cancelar pedido</button>`:''}
        ${o.status==='cancelado'?`<button class="btn line" onclick="setStatus('aguardando_pagamento')">Reabrir pedido</button>`:''}
      </div></div>

    <div class="card"><h3>📬 Dados para envio
      <span style="display:flex;gap:6px"><button class="ghost" onclick="copy(addrText(ORDERS.find(x=>x.order_nsu===CUR)),'Endereço copiado ✓')">Copiar</button><button class="ghost" onclick="printLabel()">🖨 Etiqueta</button></span></h3>
      <dl class="kv">
        <dt>Destinatário</dt><dd><b>${esc(c.name||'—')}</b></dd>
        <dt>Telefone</dt><dd>${esc(c.phone||'—')} ${c.phone?`<a href="${waLink(c.phone)}" target="_blank" rel="noopener" style="color:var(--green);font-weight:700">· abrir WhatsApp</a>`:''}</dd>
        <dt>E-mail</dt><dd>${esc(c.email||'—')}</dd>
      </dl>
      <div class="addr"><b>${esc(a.l1||'Endereço não informado')}</b><br>${a.l2?esc(a.l2)+'<br>':''}${esc(a.l3)}${a.l4?'<br>'+esc(a.l4):''}</div>
    </div>

    <div class="card"><h3>🛍 Resumo da compra</h3>
      <table class="it"><thead><tr><th>Produto</th><th class="r">Qtd</th><th class="r">Unit.</th><th class="r">Total</th></tr></thead><tbody>
      ${o._items.map(i=>`<tr><td>${esc(i.name)}${i.variant?` <span style="color:var(--ink-soft)">(${esc(i.variant)})</span>`:''}${i.preorder?' <span class="tag pre">Encomenda</span>':''}</td><td class="r">${i.qty}</td><td class="r">${fmt(i.unit)}</td><td class="r">${fmt(i.qty*i.unit)}</td></tr>`).join('')}
      </tbody></table>
      <div class="sum">
        <div><span>Subtotal</span><span>${fmt(o._subtotal)}</span></div>
        ${o._coupon?`<div class="disc"><span>Cupom ${esc(o._coupon.code)}${o._coupon.label?' — '+esc(o._coupon.label):''}</span><span>− ${fmt(o._discount)}</span></div>`:'<div><span>Cupom</span><span>nenhum</span></div>'}
        <div><span>Frete${o._ship&&o._ship.label?' ('+esc(o._ship.label)+')':''}</span><span>${o._ship?(o._ship.free?'Grátis':fmt(o._ship.price)):'—'}</span></div>
        <div class="tot"><span>Total</span><span>${fmt(o._total)}</span></div>
      </div>
      ${o._info?`<div class="cm">💰 Comissão do cupom ${esc(o._coupon.code)} (${esc(o._info.who)}): <b>${fmt(o._info.pct*Math.max(0,o._subtotal-o._discount))}</b> (${(o._info.pct*100).toFixed(0)}% de ${fmt(Math.max(0,o._subtotal-o._discount))})${o._sale?'':' — só conta depois que o pagamento for confirmado.'}</div>`:''}
    </div>

    <div class="card"><h3>💳 Pagamento</h3>
      <dl class="kv"><dt>Forma</dt><dd>${payLabel(o)}</dd>
        <dt>Situação</dt><dd>${o.paidAt?'Pago em '+dt(o.paidAt)+(o.paidManually?' (confirmado por você)':''):'Ainda não confirmado'}</dd>
        ${o.paid_amount?`<dt>Valor recebido</dt><dd>${fmt(o.paid_amount/100)}</dd>`:''}
        ${o.receipt_url?`<dt>Comprovante</dt><dd><a href="${esc(o.receipt_url)}" target="_blank" rel="noopener">abrir recibo</a></dd>`:''}
        ${o.paymentUrl && !o.paidAt?`<dt>Link de pagamento</dt><dd><a href="${esc(o.paymentUrl)}" target="_blank" rel="noopener">abrir</a></dd>`:''}</dl></div>

    <div class="card"><h3>🚚 Rastreio e observações</h3>
      <input class="field" id="trk" placeholder="Código de rastreio (Correios)" value="${esc(o.trackingCode||'')}">
      <textarea class="field" id="note" placeholder="Observação interna (só você vê)">${esc(o.note||'')}</textarea>
      <div class="btnrow"><button class="btn" onclick="saveExtras()">Salvar</button>
        <a class="btn wa" style="text-decoration:none" href="${waLink(c.phone, msgStatus)}" target="_blank" rel="noopener">💬 Avisar cliente no WhatsApp</a></div></div>`;
  document.getElementById('ov').classList.add('show');
}
function closeDetail(){ document.getElementById('ov').classList.remove('show'); CUR=null; }
function post(body){
  return api('update-order-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
}
function applyUpdated(order){
  const i = RAW.findIndex(x=>x.order_nsu===order.order_nsu); if(i>-1) RAW[i]=order;
  ORDERS = RAW.map(normalize); renderAll(); if(CUR) openDetail(CUR);
}
function setStatus(status){
  let tracking;
  if(status==='enviado'){
    const cur = (ORDERS.find(x=>x.order_nsu===CUR)||{}).trackingCode || '';
    const t = prompt('Código de rastreio dos Correios (pode deixar em branco):', cur);
    if(t===null) return; tracking = t;
  }
  post({ order_nsu:CUR, status, trackingCode:tracking }).then(d=>{ if(d.success){ applyUpdated(d.order); toast('Status atualizado ✓'); } else alert('Não deu certo: '+(d.error||'erro')); }).catch(()=>alert('Sem conexão.'));
}
function saveExtras(){
  post({ order_nsu:CUR, trackingCode:document.getElementById('trk').value, note:document.getElementById('note').value })
    .then(d=>{ if(d.success){ applyUpdated(d.order); toast('Salvo ✓'); } else alert('Não deu certo: '+(d.error||'erro')); }).catch(()=>alert('Sem conexão.'));
}
function printLabel(){
  const o = ORDERS.find(x=>x.order_nsu===CUR); if(!o) return;
  const a = addrLines(o);
  const w = window.open('', '_blank', 'width=520,height=720');
  w.document.write(`<!doctype html><meta charset="utf-8"><title>Etiqueta #${esc(o.order_nsu)}</title>
  <style>body{font-family:Arial,sans-serif;margin:0;padding:18px;color:#000}
  .box{border:2px solid #000;padding:16px;margin-bottom:12px}
  .l{font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
  .big{font-size:22px;font-weight:700;line-height:1.35}.mid{font-size:17px;line-height:1.5}
  .sm{font-size:13px;line-height:1.5} .cep{font-size:26px;font-weight:700;letter-spacing:2px;margin-top:8px}
  @media print{ .np{display:none} }</style>
  <div class="box"><div class="l">Destinatário</div>
    <div class="big">${esc(o._cust.name||'')}</div>
    <div class="mid">${esc(a.l1)}<br>${esc(a.l2)}<br>${esc(a.l3)}</div>
    <div class="cep">${esc((o._addr.cep||'').replace(/(\d{5})(\d{3})/,'$1-$2'))}</div>
    <div class="sm" style="margin-top:8px">Tel.: ${esc(o._cust.phone||'')}</div></div>
  <div class="box"><div class="l">Remetente</div><div class="mid"><b>Bielyy Store</b> — Pet Boutique<br>WhatsApp (11) 91597-1151</div></div>
  <div class="box"><div class="l">Pedido #${esc(o.order_nsu)} · conteúdo</div><div class="sm">${o._items.map(i=>esc(i.qty+'x '+i.name+(i.variant?' ('+i.variant+')':''))).join('<br>')}</div></div>
  <button class="np" onclick="window.print()" style="padding:10px 18px;font-size:15px">Imprimir</button>`);
  w.document.close();
}

/* ============ clientes ============ */
function buildCustomers(){
  const map = new Map();
  const key = (email, phone) => (email? 'e:'+email.toLowerCase() : (digits(phone)? 'p:'+digits(phone).slice(-11) : null));
  ORDERS.forEach(o=>{
    const c=o._cust; const k = key(c.email, c.phone) || 'o:'+o.order_nsu;
    let r = map.get(k);
    if(!r){ r={ name:c.name, phone:c.phone, email:c.email, city:'', addr:null, orders:[], total:0, coupons:new Set(), account:false, created:null }; map.set(k,r); }
    r.orders.push(o); if(o._sale) r.total += o._total;
    if(o._coupon) r.coupons.add(o._coupon.code);
    if(!r.addr || new Date(o._date) > new Date(r.orders[0]._date)){ r.addr=o._addr; }
    r.name = r.name || c.name; r.phone = r.phone || c.phone; r.email = r.email || c.email;
  });
  USERS.forEach(u=>{
    const k = key(u.email, u.phone);
    let r = k && map.get(k);
    if(!r){
      // tenta achar por e-mail em registros que entraram por telefone
      r = [...map.values()].find(x=>x.email && u.email && x.email.toLowerCase()===u.email.toLowerCase());
    }
    if(!r){ r={ name:u.name, phone:u.phone, email:u.email, addr:null, orders:[], total:0, coupons:new Set(), account:true, created:u.createdAt }; map.set(k||('u:'+u.email), r); }
    r.account = true; r.created = u.createdAt; r.name = r.name || u.name;
  });
  return [...map.values()].map(r=>{
    r.orders.sort((a,b)=>new Date(b._date)-new Date(a._date));
    r.last = r.orders[0] ? r.orders[0]._date : null;
    r.addr = r.orders[0] ? r.orders[0]._addr : null;
    return r;
  }).sort((a,b)=> new Date(b.last||b.created||0) - new Date(a.last||a.created||0));
}
function renderCustomers(){
  const q = (document.getElementById('cq').value||'').trim().toLowerCase(); const qd = digits(q);
  const list = buildCustomers().filter(r=>{
    if(!q) return true;
    return [r.name,r.email,r.phone,r.addr&&r.addr.city].join(' ').toLowerCase().includes(q) || (qd.length>=4 && digits(r.phone).includes(qd));
  });
  document.getElementById('customersList').innerHTML = list.length ? list.map(r=>{
    const a = r.addr ? [ [r.addr.street,r.addr.number].filter(Boolean).join(', '), r.addr.neighborhood, r.addr.city, r.addr.cep?('CEP '+fmtCep(r.addr.cep)):'' ].filter(Boolean).join(' · ') : '';
    return `<div class="c-row"><div class="c-top"><div><div class="c-name">${esc(r.name||'Sem nome')} ${r.account?'<span class="tag">✔ conta no site</span>':''}</div>
      <div class="c-meta">${r.phone?'📞 '+esc(r.phone)+' ':''}${r.phone?`<a href="${waLink(r.phone)}" target="_blank" rel="noopener" style="color:var(--green);font-weight:700">WhatsApp</a>`:''}${r.email?'<br>✉ '+esc(r.email):''}${a?'<br>📍 '+esc(a):''}</div></div>
      <div style="text-align:right"><div class="o-total">${fmt(r.total)}</div><div class="c-meta">${r.orders.length} pedido${r.orders.length===1?'':'s'}${r.last?'<br>último: '+dt(r.last):(r.created?'<br>cadastro: '+dt(r.created):'')}</div></div></div>
      ${r.coupons.size?`<div class="tags" style="margin-top:8px">${[...r.coupons].map(c=>`<span class="tag cup">🎟 ${esc(c)}</span>`).join('')}</div>`:''}
      ${r.orders.length?`<div class="c-meta" style="margin-top:8px">${r.orders.slice(0,4).map(o=>`<a href="#" onclick="event.preventDefault();openDetail('${esc(o.order_nsu)}')" style="color:var(--purple-deep);font-weight:600">#${esc(o.order_nsu)}</a>`).join(' · ')}${r.orders.length>4?' …':''}</div>`:''}
    </div>`;
  }).join('') : '<div class="empty">Nenhum cliente ainda.</div>';
}

/* ============ CSV ============ */
function csv(rows){ return '﻿'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\r\n'); }
function download(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function exportOrdersCSV(){
  const rows=[['Pedido','Data','Status','Pagamento','Cliente','Telefone','E-mail','CEP','Rua','Número','Complemento','Bairro','Cidade','Itens','Subtotal','Cupom','Desconto','Frete','Total','Comissão cupom','Rastreio','Observação']];
  filtered().forEach(o=>{ const a=o._addr; rows.push([o.order_nsu,dt(o._date),STATUS_LABEL[o.status]||o.status,o._pm,o._cust.name,o._cust.phone,o._cust.email,a.cep,a.street,a.number,a.complement,a.neighborhood,a.city,itemsText(o),o._subtotal.toFixed(2).replace('.',','),o._coupon?o._coupon.code:'',o._discount.toFixed(2).replace('.',','),o._ship?o._ship.price.toFixed(2).replace('.',','):'',o._total.toFixed(2).replace('.',','),o._commission.toFixed(2).replace('.',','),o.trackingCode||'',o.note||'']); });
  download('pedidos-bielyy.csv', csv(rows));
}
function exportCustomersCSV(){
  const rows=[['Nome','Telefone','E-mail','Cidade','CEP','Pedidos','Total gasto','Último pedido','Cupons usados','Conta no site']];
  buildCustomers().forEach(r=>rows.push([r.name,r.phone,r.email,r.addr?r.addr.city:'',r.addr?r.addr.cep:'',r.orders.length,r.total.toFixed(2).replace('.',','),r.last?dt(r.last):'',[...r.coupons].join(' '),r.account?'sim':'não']));
  download('clientes-bielyy.csv', csv(rows));
}

/* ============ avaliações (moderação) ============ */
function loadReviews(){
  const box = document.getElementById('reviewsList'); box.innerHTML = '<div class="empty">Carregando...</div>';
  fetch('/.netlify/functions/get-pending-reviews?password='+encodeURIComponent(PASSWORD)).then(r=>r.json()).then(d=>{
    const rs = d.reviews||[];
    box.innerHTML = rs.length ? rs.map(r=>`<div class="c-row" id="rv-${esc(r.id)}"><div class="c-top"><div class="c-name">${esc(r.name)}</div><div>${'⭐'.repeat(Math.max(0,Math.min(5,r.rating)))}</div></div>
      <div class="c-meta">Produto #${esc(r.productId)}</div><p style="margin:8px 0 10px;line-height:1.5">${esc(r.comment)}</p>
      <div class="btnrow" style="margin-top:0"><button class="btn" onclick="moderate('${esc(r.id)}','approve')">✓ Aprovar</button><button class="btn red" onclick="moderate('${esc(r.id)}','reject')">✕ Rejeitar</button></div></div>`).join('') : '<div class="empty">Nenhuma avaliação pendente 🎉</div>';
  }).catch(()=>{ box.innerHTML='<div class="empty">Erro ao carregar.</div>'; });
}
function moderate(id, action){
  fetch('/.netlify/functions/moderate-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:PASSWORD,reviewId:id,action})})
    .then(r=>r.json()).then(d=>{ if(d.success){ const el=document.getElementById('rv-'+id); if(el) el.remove(); } else alert('Erro: '+(d.error||'')); }).catch(()=>alert('Sem conexão.'));
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDetail(); });
const saved = sessionStorage.getItem('bielyy_admin_pwd');
if(saved){ PASSWORD = saved; refresh(false, false); }
